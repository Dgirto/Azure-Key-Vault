[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-key-vault-connector"
version = "1.0.0"
description = "Conector Ruvic de lectura de secretos, llaves y certificados en Azure Key Vault"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.15,<2.0",
    "azure-keyvault-secrets>=4.7,<5.0",
    "azure-keyvault-certificates>=4.7,<5.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_key_vault_connector*"]
